trigger:
- azure-devops

variables:
  imageName: recruitment-app
  acrLoginServer: amritarecruitACR.azurecr.io
  tag: $(Build.BuildId)

pool:
  vmImage: ubuntu-latest

steps:
- checkout: self
  persistCredentials: true

- task: Docker@2
  displayName: Build and Push Docker Image
  inputs:
    command: buildAndPush
    repository: $(imageName)
    dockerfile: Dockerfile
    containerRegistry: AmritaRecruitServiceACR
    tags: |
      $(tag)
      
- script: |
    echo "Updating Helm values.yaml (app image only)"
    sed -i '/recruitmentApp:/,/mongodb:/ s/^\(\s*tag:\).*/\1 "'"$(tag)"'"/' charts/recruitment-app/values.yaml
 
    git config user.email "azure-devops@pipeline.com"
    git config user.name "azure-devops"
 
    git fetch origin
    git checkout -B azure-devops origin/azure-devops
 
    git add HelmChart/values.yaml
    git commit -m "Update recruitment-app image tag to $(tag)"
    git push https://$GITHUB_PAT@github.com/amritasannigrahi3944-sys/Recruitment-App-Project.git azure-devops
  displayName: Update Helm Image Tag
  env:
    GITHUB_PAT: $(GITHUB_PAT)
