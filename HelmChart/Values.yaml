namespace: recruitment-ns

recruitmentApp:
  name: recruitment-app
  replicas: 2

  image:
    repository: amritarecruitacr.azurecr.io/recruitment-app
    tag: "455"

  containerPort: 3000

  service:
    name: recruitment-service
    type: LoadBalancer
    port: 80
    targetPort: 3000

  env:
    MONGODB_URI: mongodb://mongodb-service:27017/recruitment
    PORT: "3000"
    HOST: "0.0.0.0"
    NODE_ENV: production


configMap:
  name: recruitment-configmap

# ✅ PVC only REFERENCES existing StorageClass (does NOT create it)
RecruitmentPVC:
  name: Recruitment-pvc
  accessMode: ReadWriteMany
  storageClassName: azurefile-csi
  size: 10Gi

mongodb:
  name: mongodb
  replicas: 2

  image: mongo
  tag: "455"
  containerPort: 27017

  service:
    name: mongodb-service
    type: ClusterIP
    port: 27017

  pvc:
    name: mongodb-pvc
    accessMode: ReadWriteOnce
    storageClassName: managed-csi
    size: 20Gi

secret:
  name: mongodb-secret
  username: admin
  password: StrongPassword123!
