name: CI-CD-Recruitment-App

on:
  push:
    branches:
      - main

env:
  ACR_NAME: amritarecruitacr
  ACR_LOGIN_SERVER: amritarecruitacr.azurecr.io
  IMAGE_NAME: recruitment-app
  AKS_CLUSTER_NAME: aks-AmritaRecruitment
  AKS_RESOURCE_GROUP: LabsKraft360
  HELM_RELEASE_NAME: recruitment
  HELM_CHART_PATH: ./recruitment-chart

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # ---------------------------
      # 1️⃣ Checkout source code
      # ---------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # ---------------------------
      # 2️⃣ Azure Login
      # ---------------------------
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # ---------------------------
      # 3️⃣ Login to Azure Container Registry
      # ---------------------------
      - name: Login to ACR
        run: |
          az acr login --name $ACR_NAME

      # ---------------------------
      # 4️⃣ Build & Push Docker Image
      # ---------------------------
      - name: Build and Push Docker Image
        run: |
          IMAGE_TAG=${{ github.run_number }}
          docker build -t $ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG .
          docker push $ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_TAG

      # ---------------------------
      # 5️⃣ Set AKS context
      # ---------------------------
      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group $AKS_RESOURCE_GROUP \
            --name $AKS_CLUSTER_NAME \
            --overwrite-existing

      # ---------------------------
      # 6️⃣ Deploy using Helm
      # ---------------------------
      - name: Helm Upgrade / Install
        run: |
          helm upgrade --install $HELM_RELEASE_NAME $HELM_CHART_PATH \
            --set recruitmentApp.image.tag=${{ github.run_number }}
