name: CI - Build & Push to ACR

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag"
        required: true
        default: "build-${{ github.run_number }}"

env:
  IMAGE_NAME: candidate-service

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set Image Tag
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "IMAGE_TAG=${{ github.event.inputs.image_tag }}" >> $GITHUB_ENV
        else
          echo "IMAGE_TAG=build-${{ github.run_number }}" >> $GITHUB_ENV
        fi

    - name: Login to ACR
      run: |
        echo "${{ secrets.ACR_PASSWORD }}" | docker login \
        ${{ secrets.ACR_LOGIN_SERVER }} \
        -u ${{ secrets.ACR_USERNAME }} --password-stdin

    - name: Build Image
      run: |
        docker build -t \
        ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .

    - name: Run Tests (Optional)
      run: |
        npm test
      continue-on-error: true

    - name: Push Image
      run: |
        docker push \
        ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
